hero:
  title: Put your data, design, and policy skills to work to improve the lives of millions of New Yorkers.
  subtitle: '[Our Office](https://www.nyc.gov/site/opportunity/index.page) uses research, data, and design to improve government services, reduce poverty, and expand opportunity for New Yorkers.'
  applyLabel: Apply now
ourWork:
  title: Our Work
  items:
    - title: Equity
      body: We believe that equal opportunity and the possibility of upward mobility must be genuine — that where you start out in life should not dictate where you end up. But too often poverty, racism, and other structural inequalities and social conditions create barriers for New Yorkers that limit their ability to advance and participate fully in the city’s economic and civic life.
    - title: Evidence
      body: We believe that the public sector should make decisions based on rigorous attention to data — drawn from research and evaluation, performance measurement, and the voices of those who experience public services as well as the challenges they are meant to address. Policies and programs exist that can effectively reduce poverty and broaden opportunity; government should invest in those that work, and end those that do not.
    - title: Innovation
      body: We believe that more solutions are required to address unmet needs and stubborn problems — and are optimistic that new approaches delivered through government can achieve large-scale impact. Innovation is fundamentally about getting better results, and it demands a commitment to assess outcomes rigorously, capture and respond to lessons, and accept the risk that some efforts will fail.
sections:
  - title: Digital & Data Products
    body: |-
      Our digital work focuses on making it easier for New Yorkers to access services by connecting them to clear, actionable information about benefits, programs, services, and employment. We do this through two digital tools, [ACCESS NYC](https://access.nyc.gov) and [Jobs NYC](https://jobs.nyc.gov/).

      We support open source and scalable technology in the services we develop, such as the NYC Benefits Platform (open source rules engine and plain-language content dataset), so the City and other civic technologists can build upon what works.

      Our office also manages the [Poverty Atlas NYC](https://www.nyc.gov/site/opportunity/poverty-in-nyc/poverty-atlas.page), [Equity NYC](https://equity.nyc.gov), and the [Workforce Data Portal](https://workforcedata.nyc.gov) sites to make the City’s data more accessible, transparent, and actionable.

  - title: Programs & Evaluation
    body: |-
      NYC Opportunity helps City partners to design, pilot, and assess innovative anti-poverty and equity strategies. Drawing on our expertise in implementation, performance management, and evaluation, we have helped to launch over 100 human services programs and systems-change initiatives in partnership with over 30 agencies and Mayoral offices.

      We work across a diverse array of priority policy areas and populations, including: workforce development and advancement; financial empowerment, asset building, and cash transfers; education; health and mental health; homelessness; opportunity youth; legal system-involved youth and adults, and others. Where strategies show promise, NYC Opportunity works with independent research firms to conduct evaluations of projects within our portfolio, as well as select citywide initiatives. These evaluations inform the City’s program and budget decision-making and contribute to public policy in the social services more generally.
    buttonLabel: View P&E work
    media:

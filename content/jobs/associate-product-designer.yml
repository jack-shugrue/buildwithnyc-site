applyNotes:
  - Due to the volume of applications, we may not be able to respond to every application.
about: |-
  Reporting to the Senior Product Manager, you’ll support new feature development, refinements, metric reporting, and maintenance for [ACCESS NYC](https://access.nyc.gov), as well as the growth and adoption of the NYC Benefits Platform, the open-source tools we develop and maintain alongside ACCESS NYC.

  We’re looking for someone experienced who can help us better understand the challenges employers face, how they’re solving them today, who else is working on them, and what the City might do to ease these pain points.

  You’ll work with our product managers, content strategists, developers, and interns, and with stakeholders across the government agencies that deliver benefits and services, and engage the New Yorkers we serve.
aboutNote: This position works from our office in Downtown Brooklyn.
responsibilities: |-
  - Research and manage updates for the ACCESS NYC Benefits Screener, which lets households check their potential eligibility for 40+ benefits based on income, expenses, and household composition.
    - Analyze complex eligibility criteria for public benefits.
    - Research, identify, and analyze changes to eligibility criteria, and translate them into tasks for developers: updating, drafting, or deleting income tables, if/then statements, and more.
  - Lead the design and implementation of new eligibility screening rules, including scoping, working with agency partners to interpret policy, and working with developers to implement, test, and launch.
  - Find ways to simplify the process, so it’s easier for technical and non-technical people to update and manage.
  - Support the discovery, research, and development of new benefits access products and services.
  - Design, run, and interpret user and web experiments, including A/B and multivariate tests.
  - Produce metrics and analytics reports for the benefits access portfolio.
  - Maintain product documentation.
skillsIntro: You may not have every skill below, and that’s okay. We encourage you to apply even if you don’t meet all of them.
skills:
  - title: Commitment to equity
    description: 'You care about advancing equality and opportunity, and it shows in your work: you ask who a change helps, who it might leave out, and how to reach the New Yorkers who need benefits most.'
  - title: Experience with communities
    description: You’ve worked closely with people who use public services and programs, or have lived experience with them yourself. You’ll bring that understanding to research and to decisions about ACCESS NYC.
  - title: Policy or public-sector background
    description: Experience in policy, government, or non-profits, especially with low-income and vulnerable youth and families, is a plus. It helps when reading eligibility rules and working with agency partners.
  - title: Making the complex simple
    description: You’re able and eager to learn how government programs work, from income limits to household rules, and to turn that into screener logic and plain language anyone can follow.
  - title: Clear communication
    description: You write and present clearly, to developers turning rules into code, to agency partners checking our reading of policy, and to leadership weighing what to build next.
  - title: Data and analytics
    description: You’re familiar with, or willing to learn, data analysis methods and tools like Google Analytics, Looker Studio, and Google Tag Manager, to measure how the screener is used and to run A/B tests.
  - title: Organized and self-directed
    description: You organize your own work across several projects at once, and delegate tasks to others when it helps the team move faster.
education: A master’s degree from an accredited college or university with a specialization in an appropriate field of physical, biological, or environmental science, or in public health.
benefits: |-
  A permanent, full-time position with competitive salary and benefits. The salary range is $64,140 – $77,609, depending on experience and qualifications.

  To learn more about New York City employee benefits, visit the [NYC Office of Labor Relations](https://www.nyc.gov/site/olr/index.page).

  Applicants must be authorized to work in the United States. We’re unable to sponsor visas.
